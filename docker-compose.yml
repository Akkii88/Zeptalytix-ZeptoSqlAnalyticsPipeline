version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zepto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./zepto_v2.csv:/docker-entrypoint-initdb.d/zepto_v2.csv:ro

volumes:
  db_data:
